
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RedHawk Exchange</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!--Header section for left side-->
    <header class = "header">
        <div class = "brand">
            <!-- Change to actual logo picture path -->
            <img
                class = "brand-logo"
                src = "{{ url_for('static', filename='img/hawkLogo.svg') }}" 
                alt = "RedHawk Exchange Logo"
            />

            <div class = "brand-name">
                <span class = "brand-redhawk">RedHawk</span>
                <span class = "brand-exchange">Exchange</span>
            </div>
        </div>

        <!-- Search Bar -->
         <div class = "search-bar">
            <div class = "search">
                <span class = "search-icon" aria-hidden = "true"></span>
                <input 
                  class="search-input"
                  type="text" 
                  placeholder="Search listing..."
                />
            </div>
         </div>

         <!-- Top Right button -->
          <div class = "actions">

            <!-- Creat Listing button-->
             <button class = "primary-btn">Create Listing</button>

            <!-- Messages button -->
            <button class = "icon-btn" aria-label = "Messages">
                <i class = "fa-solid fa-envelope"></i>
            </button>

            <!-- Profile button -->
             <button class = "icon-btn" aria-label = "Profile">
                <i class = "fa-solid fa-user"></i>
             </button>

          </div>
    </header>

    <!-- Category buttons -->
    <section class = "categories">
        <button class = "pill" type = "button">Technology</button>
        <button class = "pill" type = "button">Stationary</button>
        <button class = "pill" type = "button">Textbooks</button>
    </section>

    <!-- Main portion of page where products are shown (Hardcoded data not connected)-->
     <main class = "page">
        <div class = "container">
      <h2 class = "page-title">Products</h2>
      
      <!-- Product grid -->
       <section class = "grid">
        
        <article class = "card">
            <!-- Card 1-->
            <div class = "card-media">
                <!-- Change to actual product image path -->
                <img
                    class = "card-image"
                    src = "{{ url_for('static', filename='img/macbook.jpeg') }}" 
                    alt = "Product Image"
                />
            </div>

            <div class = "card-body">
                <div class = "card-name">Macbook Pro</div>
                <div class = "card-price">$1200</div>
            </div>
        </article>

        <article class = "card">
            <!-- Card 2-->
            <div class = "card-media">
                <!-- Change to actual product image path -->
                <img
                    class = "card-image"
                    src = "{{ url_for('static', filename='img/textbook.jpg.webp') }}" 
                    alt = "Product Image"
                />
            </div>

            <div class = "card-body">
                <div class = "card-name">Math Textbook</div>
                <div class = "card-price">$55</div>
            </div>
        </article>

       <article class = "card">
            <!-- Card 3-->
            <div class = "card-media">
                <!-- Change to actual product image path -->
                <img
                    class = "card-image"
                    src = "{{ url_for('static', filename='img/calculator.avif') }}" 
                    alt = "Product Image"
                />
            </div>

            <div class = "card-body">
                <div class = "card-name">Calculator</div>
                <div class = "card-price">$60</div>
            </div>
        </article>

        <article class = "card">
            <!-- Card 4-->
            <div class = "card-media">
                <!-- Change to actual product image path -->
                <img
                    class = "card-image"
                    src = "{{ url_for('static', filename='img/iphone12.jpg.webp') }}"
                    alt = "Product Image"
                />
            </div>

            <div class = "card-body">
                <div class = "card-name">iPhone 12</div>
                <div class = "card-price">$800</div>
            </div>
        </div>
        </section>
    </main>
</body>
