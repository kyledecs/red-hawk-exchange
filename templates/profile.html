<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RedHawk Exchange</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

    <!--Header section for left side-->
    <header class = "header">
        <div class = "brand">
            <a href="{{url_for('homepage')}}">
            <img
                class = "brand-logo"
                src = "{{ url_for('static', filename='img/hawkLogo.svg') }}" 
                alt = "RedHawk Exchange Logo"
            />
            </a>

            <div class = "brand-name">
                <span class = "brand-redhawk">RedHawk</span>
                <span class = "brand-exchange">Exchange</span>
            </div>
        </div>

         <!-- Top Right button -->
          <div class = "actions">

            <!-- Create Listing button -->
             <a href = "{{ url_for('createListing') }}" 
                class = "primary-btn" 
                style = "text-decoration: none; display: inline-flex; align-items: center;"> + Create Listing
            </a>

            <!-- Messages button -->
            <button class = "icon-btn" aria-label = "Messages">
                <i class = "fa-solid fa-envelope"></i>
            </button>

            <!-- Profile button -->
             <div class="dropdown">
                <button class="icon-btn" aria-label="Profile">
                    {% if user_data and user_data.avatarURL %}
                        <img src="{{ user_data.avatarURL }}" alt="Profile" class="profile-img-icon">
                    {% else %}
                        <i class="fa-solid fa-user"></i>
                    {% endif %}
                </button>

                <div class="dropdown-content">
                    <a href="{{ url_for('profile') }}">
                        <i class="fa-solid fa-id-card"></i> View Profile
                    </a>
                    <hr> 
                    <a href="{{ url_for('logout') }}" class="logout-link">
                        <i class="fa-solid fa-right-from-bracket"></i> Log Out
                    </a>
                </div>
            </div>

          </div>
    </header>

<body>
    <div id="header">
    <div class="container">
        <div class="profile-section">
            <div class="profile-left">
                <div class="profile-icon-container">
                    <i class="fa-solid fa-user profile-icon-styled"></i>
                </div>
            <div class="user-info">
                <div id="displayInfo">
                <h2 id="usernameDisplay">Username</h2>
                <p id="gradDisplay" class="grad-year">Class Year</p>
                </div>

                <div id="editInfo" style="display: none;">
                <input type="text" id="usernameInput" placeholder="Enter username">
                <input type="text" id="gradInput" placeholder="Class year (e.g. 2026)">
                <button onclick="saveProfile()">Save</button>
                </div>
            </div>
                
            </div>

            <button class="chat-btn" onclick="editProfile()">Edit</button>
        </div>

    <div class="tabs">
            <button class="tab active-tab" onclick="showActive()">Active Listings</button>
            <button class="tab" onclick="showSaved()">Saved Listings</button>
    </div>
 <div id="activeListings" class="listings-grid">

            <a href="item-books.html" class="item-card"> <!-- SITE DOESN'T EXIST; ERROR -->
                <img src="{{ url_for('static', filename='img/textbook.jpg.webp') }}">
                <p>Science textbooks</p>
                <span>$40.00</span>
            </a>

            <a href="item-laptop.html" class="item-card"> <!-- SITE DOESN'T EXIST; ERROR -->
                <img src="{{ url_for('static', filename='img/macbook.jpeg') }}">
                <p>Laptop</p>
                <span>$200.00</span>
            </a>
        </div>

<div id="savedListings" class="listings-grid" style="display: none;"> <!-- SITE DOESN'T EXIST; ERROR -->
            <a href="item-phone.html" class="item-card">
                <img src="{{ url_for('static', filename='img/iphone12.jpg.webp') }}">
                <p>Phone</p>
                <span>$250.00</span>
                </a>
            </div>

        </div>

    </div>

<script>
function showActive(){
    document.getElementById("activeListings").style.display = "grid";
    document.getElementById("savedListings").style.display = "none";
}

function showSaved(){
    document.getElementById("activeListings").style.display = "none";
    document.getElementById("savedListings").style.display = "grid";
}

function editProfile(){
    document.getElementById("displayInfo").style.display = "none";
    document.getElementById("editInfo").style.display = "block";

    document.getElementById("usernameInput").value =
    document.getElementById("usernameDisplay").innerText;

    document.getElementById("gradInput").value =
    document.getElementById("gradDisplay").innerText.replace("Class of ", "");
}

function saveProfile(){
    const newUsername = document.getElementById("usernameInput").value;
    const newGradYear = document.getElementById("gradInput").value;

    document.getElementById("usernameDisplay").innerText = newUsername;
    document.getElementById("gradDisplay").innerText = "Class of " + newGradYear;

    document.getElementById("displayInfo").style.display = "block";
    document.getElementById("editInfo").style.display = "none";
}
</script>

</body>
</html>
