<!DOCTYPE html>
<html>
<head>
  <title>Login - RedHawkExchange</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      width: 380px;
      text-align: center;
    }

    h2 {
      margin-bottom: 25px;
      color: #CE1126;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: #CE1126;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #CE1126;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background-color: #a50e1f;
    }

    a {
      color: #CE1126;
      text-decoration: none;
      font-size: 14px;
    }

    a:hover {
      text-decoration: underline;
    }

    .footer-text {
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>RedHawkExchange</h2>

    <form method="POST" action="/login">
      <input name="email" placeholder="Email" required>
      <input name="password" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <div class="footer-text">
      <p><a href="/register-page">New user? Create an account</a></p>
    </div>
  </div>
</body>
</html>
